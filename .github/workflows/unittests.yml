name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - task-1
      - task-2
      - task-3
      - task1
      - task2
      - task3
  pull_request:
    branches:
      - main
      - task-1
      - task-2
      - task-3
      - task1
      - task2
      - task3

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flask flask-cors

    - name: Run Backend Unit Tests
      run: |
        if [ -f tests/test_backend.py ]; then
          python -m unittest tests/test_backend.py
        else
          echo "No backend tests found, skipping."
        fi

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        if [ -d frontend ]; then
          cd frontend
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
        else
          echo "No frontend directory found, skipping."
        fi

    - name: Build Frontend
      run: |
        if [ -d frontend ]; then
          cd frontend
          npm run build
        else
          echo "No frontend directory found, skipping."
        fi
